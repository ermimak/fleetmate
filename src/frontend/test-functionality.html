<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetMate Functionality Test</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="container" style="padding: 2rem;">
        <h1>FleetMate Frontend Functionality Test</h1>
        
        <div class="card mb-4">
            <div class="card-header">
                <h3>Test Results</h3>
            </div>
            <div class="card-body">
                <div id="testResults">
                    <p>Running tests...</p>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h3>Manual Test Buttons</h3>
            </div>
            <div class="card-body">
                <div class="d-flex gap-2 flex-wrap">
                    <button class="btn btn-primary" id="testUserModal">Test User Modal</button>
                    <button class="btn btn-primary" id="testVehicleModal">Test Vehicle Modal</button>
                    <button class="btn btn-primary" id="testApprovalModal">Test Approval Modal</button>
                    <button class="btn btn-primary" id="testEligibilityModal">Test Eligibility Modal</button>
                    <button class="btn btn-success" id="testToast">Test Toast</button>
                    <button class="btn btn-warning" id="testAlert">Test Alert</button>
                    <button class="btn btn-info" id="testAPI">Test API Connection</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Test Modals -->
    <div id="testUserModal" class="modal-overlay d-none">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Test User Modal</h2>
                <button class="modal-close" onclick="document.getElementById('testUserModal').classList.add('d-none')">&times;</button>
            </div>
            <div class="modal-body">
                <p>This is a test user modal. All functionality should work correctly.</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="document.getElementById('testUserModal').classList.add('d-none')">Close</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const results = document.getElementById('testResults');
            let testsPassed = 0;
            let totalTests = 0;

            function addResult(test, passed, message = '') {
                totalTests++;
                if (passed) testsPassed++;
                const status = passed ? '✅' : '❌';
                const div = document.createElement('div');
                div.innerHTML = `${status} ${test}: ${message}`;
                div.className = passed ? 'text-success' : 'text-danger';
                results.appendChild(div);
            }

            // Test utility functions
            addResult('showToast function', typeof showToast === 'function', 'Function exists');
            addResult('showAlert function', typeof showAlert === 'function', 'Function exists');
            addResult('showError function', typeof showError === 'function', 'Function exists');
            addResult('hideError function', typeof hideError === 'function', 'Function exists');
            addResult('showLoading function', typeof showLoading === 'function', 'Function exists');
            addResult('hideLoading function', typeof hideLoading === 'function', 'Function exists');

            // Test API service
            addResult('API service', typeof api === 'object' && api !== null, 'API service exists');
            addResult('API createRequest', typeof api.createRequest === 'function', 'Method exists');
            addResult('API getUsers', typeof api.getUsers === 'function', 'Method exists');
            addResult('API getCars', typeof api.getCars === 'function', 'Method exists');

            // Test page initialization functions
            addResult('initUserManagement', typeof initUserManagement === 'function', 'Function exists');
            addResult('initFleetManagement', typeof initFleetManagement === 'function', 'Function exists');
            addResult('initNewRequestPage', typeof initNewRequestPage === 'function', 'Function exists');
            addResult('initApprovals', typeof initApprovals === 'function', 'Function exists');

            // Add summary
            const summary = document.createElement('div');
            summary.innerHTML = `<hr><strong>Summary: ${testsPassed}/${totalTests} tests passed</strong>`;
            summary.className = testsPassed === totalTests ? 'text-success' : 'text-warning';
            results.appendChild(summary);

            // Setup manual test buttons
            document.getElementById('testUserModal')?.addEventListener('click', () => {
                document.getElementById('testUserModal').classList.remove('d-none');
            });

            document.getElementById('testToast')?.addEventListener('click', () => {
                showToast('Test toast message!', 'success');
            });

            document.getElementById('testAlert')?.addEventListener('click', () => {
                showAlert('Test alert message!', 'info');
            });

            document.getElementById('testAPI')?.addEventListener('click', async () => {
                try {
                    const response = await fetch('/api/users/me', {
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('authToken')}`
                        }
                    });
                    if (response.ok) {
                        showToast('API connection successful!', 'success');
                    } else {
                        showToast('API connection failed - check authentication', 'danger');
                    }
                } catch (error) {
                    showToast('API connection error: ' + error.message, 'danger');
                }
            });
        });
    </script>
</body>
</html>
