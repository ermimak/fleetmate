<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Management - FleetMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <i class="bi bi-truck"></i> FleetMate
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> <span id="currentUserName">User</span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid" style="padding-top: 76px;">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-white sidebar collapse">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="dashboard.html" data-page="dashboard">
                                <i class="bi bi-speedometer2"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="my-requests.html" data-page="my-requests">
                                <i class="bi bi-file-text"></i> My Requests
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="new-request.html" data-page="new-request">
                                <i class="bi bi-plus-circle"></i> New Request
                            </a>
                        </li>
                        <li class="nav-item" id="approvalsNav">
                            <a class="nav-link" href="approvals.html" data-page="approvals">
                                <i class="bi bi-check-circle"></i> Approvals
                            </a>
                        </li>
                        <li class="nav-item" id="manageRequestsNav">
                            <a class="nav-link" href="manage-requests.html" data-page="manage-requests">
                                <i class="bi bi-clipboard-check"></i> Manage Requests
                            </a>
                        </li>
                        <li class="nav-item" id="userManagementNav">
                            <a class="nav-link" href="user-management.html" data-page="user-management">
                                <i class="bi bi-people"></i> User Management
                            </a>
                        </li>
                        <li class="nav-item" id="fleetManagementNav">
                            <a class="nav-link" href="fleet-management.html" data-page="fleet-management">
                                <i class="bi bi-truck"></i> Fleet Management
                            </a>
                        </li>
                        <li class="nav-item" id="departmentManagementNav">
                            <a class="nav-link active" href="departments.html" data-page="departments">
                                <i class="bi bi-building"></i> Departments
                            </a>
                        </li>
                        <li class="nav-item" id="reportsNav">
                            <a class="nav-link" href="reports.html" data-page="reports">
                                <i class="bi bi-graph-up"></i> Reports
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content Area -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2"><i class="bi bi-building"></i> Department Management</h1>
                    <button class="btn btn-primary" onclick="openDepartmentModal()">
                        <i class="bi bi-plus-circle"></i> Add Department
                    </button>
                </div>

                <!-- Alert Container -->
                <div id="alertContainer"></div>

                <!-- Departments Table -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Departments</h5>
                    </div>
                    <div class="card-body">
                        <div id="departmentsTableContainer">
                            <div class="text-center py-4">
                                <div class="spinner-border" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Department Modal -->
    <div class="modal fade" id="departmentModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="departmentModalTitle">Add Department</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="departmentForm">
                    <div class="modal-body">
                        <div id="departmentError" class="alert alert-danger d-none"></div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="departmentName" class="form-label">Department Name *</label>
                                    <input type="text" class="form-control" id="departmentName" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="departmentCode" class="form-label">Department Code</label>
                                    <input type="text" class="form-control" id="departmentCode" placeholder="e.g., OPS, HR, IT">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="departmentDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="departmentDescription" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="departmentAuthority" class="form-label">Department Authority</label>
                            <select class="form-select" id="departmentAuthority">
                                <option value="">Select Authority (Optional)</option>
                            </select>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="departmentActive" checked>
                            <label class="form-check-label" for="departmentActive">
                                Active Department
                            </label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">
                            <span id="departmentSubmitText">Create Department</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- User Assignment Modal -->
    <div class="modal fade" id="userAssignmentModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Manage Department Users</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6">
                            <h6>Available Users</h6>
                            <div id="availableUsers" class="border p-3" style="height: 300px; overflow-y: auto;">
                                <!-- Available users will be loaded here -->
                            </div>
                        </div>
                        <div class="col-md-6">
                            <h6>Department Users</h6>
                            <div id="departmentUsers" class="border p-3" style="height: 300px; overflow-y: auto;">
                                <!-- Department users will be loaded here -->
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/departments.js"></script>
</body>
</html>
